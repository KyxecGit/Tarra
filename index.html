<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tarra  Restaurant">
    <meta name="keywords" content="tarra, restaurant, dining">
    <title>Tarra</title>
    <link rel="preload" href="images/back.PNG" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section class="hero" aria-label="Hero">
      <div class="hero-bg"></div>
      <div class="hero-darken"></div>
      <div class="hero-content">
        <img src="images/text.PNG" alt="Tarra  Opening Soon" class="hero-card">
      </div>
    </section>
    <div class="section-divider">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdWViGALZU_3JGnYZQz_Jzi201hvGJXqs1ESQE-g1cvF5Zjsw/viewform?usp=sharing&ouid=109997373567622932325" target="_blank" rel="noopener noreferrer" class="hiring-btn">
        <span class="hiring-btn-label">We're Hiring</span>
        <span class="hiring-btn-sub">Join the Tarra team — Apply Now</span>
      </a>
    </div>
    <section class="video-section">
      <video class="video-section-bg" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="videos/video.mp4" type="video/mp4">
      </video>
      <div class="video-section-overlay"></div>
      <div class="video-section-inner">
        <h2 class="section-title">Get to Know Us</h2>
        <p class="section-subtitle">Experience the spirit of Tarra and join our journey.</p>
        <div class="cta-wrapper">
          <a href="https://www.instagram.com/tarrachicago/" target="_blank" rel="noopener noreferrer" class="instagram-btn">
            Follow us on Instagram
          </a>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
