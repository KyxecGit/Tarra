<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tarra  Restaurant">
    <meta name="keywords" content="tarra, restaurant, dining">
    <title>Tarra</title>
    <link rel="preload" href="images/back.PNG" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section class="hero" aria-label="Hero">
      <div class="hero-bg"></div>
      <div class="hero-darken"></div>
      <div class="hero-content">
        <img src="images/text.PNG" alt="Tarra  Opening Soon" class="hero-card">
      </div>
      <svg class="wave-transition" viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,40 Q300,80 600,40 T1200,40 L1200,120 L0,120 Z" fill="#0c0c0c"/>
      </svg>
    </section>
    <section class="video-section">
      <div class="video-section-inner">
        <h2 class="section-title">Get to Know Us</h2>
        <div class="video-grid">
          <div class="video-card">
            <video class="video-player" controls playsinline preload="metadata" poster="videos/poster.jpg">
              <source src="videos/video.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </div>
        </div>
        <div class="instagram-wrapper">
          <a href="https://www.instagram.com/tarrachicago/" target="_blank" rel="noopener noreferrer" class="instagram-btn">
            Follow us on Instagram
          </a>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
